name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.case }}
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/gikon3/cpp-arch:latest
      options: --cap-add=SYS_PTRACE

    strategy:
      fail-fast: false
      matrix:
        include:
          - case: asan-ubsan
            profile: .github/conan/asan-ubsan
            preset: conan-debug
          - case: tsan
            profile: .github/conan/tsan
            preset: conan-debug
          - case: release
            profile: .github/conan/linux-clang
            settings: -s build_type=Release
            preset: conan-release
            options: -DWASAFE_BUILD_EXAMPLES=ON -DWASAFE_BUILD_BENCHMARKS=ON
          - case: gcc
            profile: gcc
            preset: conan-release

    steps:
      - uses: actions/checkout@v4

      - name: Тулчейн образа
        id: toolchain
        run: |
          cat /etc/cpp-arch-release
          echo "version=clang$(clang++ -dumpversion | cut -d. -f1)-gcc$(g++ -dumpversion | cut -d. -f1)" >> "$GITHUB_OUTPUT"
          conan_home=$(conan config home)
          echo "conan_home=${conan_home:?путь кеша Conan пуст}" >> "$GITHUB_OUTPUT"

      - name: Кеш пакетов Conan
        uses: actions/cache@v4
        with:
          path: ${{ steps.toolchain.outputs.conan_home }}
          key: conan-${{ steps.toolchain.outputs.version }}-${{ matrix.case }}-${{ hashFiles('conanfile.py', '.github/conan/*') }}
          restore-keys: |
            conan-${{ steps.toolchain.outputs.version }}-${{ matrix.case }}-

      - name: Установить зависимости
        run: conan install . --build=missing -pr:a ${{ matrix.profile }} ${{ matrix.settings }}

      - name: Сконфигурировать
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.options }}

      - name: Собрать
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Прогнать тесты
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --parallel $(nproc) --schedule-random --timeout 30

      - name: Прогнать стенд
        if: matrix.case == 'release'
        run: ./build/Release/bin/wasafe-bench --scale=0.05

      - name: Почистить кеш Conan перед сохранением
        if: always()
        run: conan cache clean "*" --source --build --temp

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/gikon3/cpp-arch:latest

    steps:
      - uses: actions/checkout@v4

      - name: Тулчейн образа
        id: toolchain
        run: |
          cat /etc/cpp-arch-release
          echo "version=clang$(clang++ -dumpversion | cut -d. -f1)-gcc$(g++ -dumpversion | cut -d. -f1)" >> "$GITHUB_OUTPUT"
          conan_home=$(conan config home)
          echo "conan_home=${conan_home:?путь кеша Conan пуст}" >> "$GITHUB_OUTPUT"

      - name: Кеш пакетов Conan
        uses: actions/cache@v4
        with:
          path: ${{ steps.toolchain.outputs.conan_home }}
          key: conan-${{ steps.toolchain.outputs.version }}-tidy-${{ hashFiles('conanfile.py', '.github/conan/*') }}
          restore-keys: |
            conan-${{ steps.toolchain.outputs.version }}-tidy-

      - name: Установить зависимости
        run: conan install . --build=missing -pr:a .github/conan/linux-clang -s build_type=Release

      - name: Сконфигурировать
        run: cmake --preset conan-release -DWASAFE_BUILD_EXAMPLES=ON -DWASAFE_BUILD_BENCHMARKS=ON

      - name: Прогнать clang-tidy
        run: |
          run-clang-tidy -j $(nproc) -use-color -p build/Release -quiet \
              -warnings-as-errors '*' -allow-no-checks -source-filter '^(?!.*/build/)'

      - name: Почистить кеш Conan перед сохранением
        if: always()
        run: conan cache clean "*" --source --build --temp
