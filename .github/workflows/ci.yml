name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: clang Debug (${{ matrix.profile }})
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/gikon3/cpp-arch:latest
      options: --cap-add=SYS_PTRACE

    strategy:
      fail-fast: false
      matrix:
        profile: [asan-ubsan, tsan]

    steps:
      - uses: actions/checkout@v4

      - name: Тулчейн образа
        id: toolchain
        run: |
          cat /etc/cpp-arch-release
          echo "clang_major=$(clang++ -dumpversion | cut -d. -f1)" >> "$GITHUB_OUTPUT"
          conan_home=$(conan config home)
          echo "conan_home=${conan_home:?путь кеша Conan пуст}" >> "$GITHUB_OUTPUT"

      - name: Кеш пакетов Conan
        uses: actions/cache@v4
        with:
          path: ${{ steps.toolchain.outputs.conan_home }}
          key: conan-clang${{ steps.toolchain.outputs.clang_major }}-${{ matrix.profile }}-${{ hashFiles('conanfile.py', '.github/conan/*') }}
          restore-keys: |
            conan-clang${{ steps.toolchain.outputs.clang_major }}-${{ matrix.profile }}-

      - name: Установить зависимости
        run: conan install . --build=missing -pr:a .github/conan/${{ matrix.profile }}

      - name: Сконфигурировать
        run: cmake --preset conan-debug

      - name: Собрать
        run: cmake --build --preset conan-debug

      - name: Прогнать тесты
        run: ctest --preset conan-debug --output-on-failure --parallel $(nproc) --schedule-random --timeout 30

      - name: Почистить кеш Conan перед сохранением
        if: always()
        run: conan cache clean "*" --source --build --temp
